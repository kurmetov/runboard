[project]
name = "runboard"
version = "0.1.0"
description = "File-based experiment tracking and a local MLflow-like browser. Zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
runboard = "runboard.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runboard"]
