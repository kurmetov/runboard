<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4;
  --surface-1: #fcfcfb;
  --surface-2: #f0efec;
  --border: #e2e1dc;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7973;
  --accent: #2a78d6;
  --accent-soft: #e6f0fc;
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface-1: #1a1a19; --surface-2: #242423; --border: #33332f;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --accent: #3987e5; --accent-soft: #1b2a3d;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface-1: #1a1a19; --surface-2: #242423; --border: #33332f;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --accent: #3987e5; --accent-soft: #1b2a3d;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
header { display: flex; align-items: center; gap: 20px; padding: 0 20px; height: 52px;
  background: var(--surface-1); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
header .brand { font-weight: 650; letter-spacing: -0.01em; }
header .brand span { color: var(--text-muted); font-weight: 500; }
nav { display: flex; gap: 4px; }
nav a { padding: 6px 12px; border-radius: 6px; color: var(--text-secondary); }
nav a.active { background: var(--accent-soft); color: var(--accent); text-decoration: none; }
header .spacer { flex: 1; }
button, select, input { font: inherit; color: var(--text-primary); }
button { background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
select, input[type=search], input[type=text] { background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; }
.layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 52px); }
aside { border-right: 1px solid var(--border); background: var(--surface-1); padding: 14px 10px; }
aside h4 { margin: 4px 8px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
aside a { display: flex; justify-content: space-between; padding: 6px 8px; border-radius: 6px; color: var(--text-primary); }
aside a.active { background: var(--accent-soft); color: var(--accent); text-decoration: none; }
aside a .count { color: var(--text-muted); font-variant-numeric: tabular-nums; }
main { padding: 18px 22px 40px; min-width: 0; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 22px 0 10px; }
.sub { color: var(--text-secondary); margin-bottom: 16px; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; }
.pad { padding: 14px 16px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-weight: 600; color: var(--text-secondary); font-size: 12.5px; background: var(--surface-1);
  position: sticky; top: 0; cursor: default; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--text-primary); }
tbody tr:hover td { background: var(--surface-2); }
td.num { text-align: right; }
.scroll { overflow: auto; max-height: 70vh; border-radius: 10px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 8px 1px 6px;
  border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); }
.badge .dot { width: 8px; height: 8px; border-radius: 50%; }
.tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 5px; background: var(--surface-2);
  color: var(--text-secondary); margin-right: 4px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 14px 0 16px; }
.tabs a { padding: 8px 14px; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a.active { color: var(--text-primary); border-bottom-color: var(--accent); text-decoration: none; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.md { line-height: 1.55; overflow-wrap: anywhere; }
.md table { width: auto; margin: 10px 0; }
.md th { position: static; }
.md td, .md th { white-space: normal; }
.md h1 { font-size: 20px; } .md h2 { font-size: 17px; margin-top: 26px; } .md h3 { font-size: 15px; }
.md pre { background: var(--surface-2); padding: 10px; border-radius: 6px; overflow: auto; }
.md code { background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
.md pre code { background: none; padding: 0; }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 22px 0; }
pre.raw { margin: 0; padding: 14px; overflow: auto; max-height: 72vh; font-family: var(--mono); font-size: 12.5px; }
.empty { color: var(--text-muted); padding: 30px; text-align: center; }
.controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
.controls label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-muted); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); cursor: pointer;
  background: var(--surface-1); color: var(--text-secondary); user-select: none; }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
td.heat { text-align: right; font-weight: 500; min-width: 74px; outline-offset: -2px; }
td.heat:hover, td.heat:focus { outline: 2px solid var(--text-primary); }
.legend-ramp { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
.legend-ramp .bar { width: 160px; height: 10px; border-radius: 3px; }
#tooltip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; max-width: 320px; }
#tooltip .v { font-size: 15px; font-weight: 650; }
#tooltip .l { color: var(--text-secondary); }
.diff td.changed { background: var(--accent-soft); }
.toast { position: fixed; bottom: 18px; right: 18px; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px; max-width: 460px; box-shadow: 0 4px 16px rgba(0,0,0,.15); z-index: 30; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .axis text { fill: var(--text-muted); font-size: 11px; }
.chart .grid line { stroke: var(--border); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 2px; display: inline-block; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 14px 16px 30px; }
  header { gap: 10px; padding: 0 12px; overflow-x: auto; }

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
};
const keep = (xs) => xs.filter((x) => x !== null && x !== undefined);
const setMain = (...nodes) => $("#main").replaceChildren(...keep(nodes));
const setSide = (...nodes) => $("#side").replaceChildren(...keep(nodes));
const api = async (path, opts) => { const r = await fetch(path, opts); if (!r.ok) throw new Error(r.status); return r.json(); };
const md = (text) => {
  const d = el("div", { class: "md" });
  if (window.marked) d.innerHTML = marked.parse(text);  // own repo docs only
  else d.append(el("pre", {}, text));
  return d;
};
const fmt = (v) => {
  if (v === null || v === undefined || v === "") return "—";
  if (typeof v === "number") {
    if (Number.isInteger(v)) return String(v);
    const a = Math.abs(v);
    if (a >= 1e6) return v.toExponential(2);
    if (a >= 100) return v.toFixed(1);
    if (a >= 0.01) return v.toFixed(3);
    return String(Number(v.toPrecision(3)));  // 3e-4 stays "0.0003", not "0.000"
  }
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
};
const dur = (s) => s == null ? "—" : s < 60 ? `${s.toFixed(0)} s` : s < 3600 ? `${(s / 60).toFixed(1)} min` : `${(s / 3600).toFixed(1)} h`;
const flatten = (o, p = "", out = {}) => {
  for (const [k, v] of Object.entries(o || {})) {
    const key = p ? `${p}.${k}` : k;
    if (v && typeof v === "object" && !Array.isArray(v)) flatten(v, key, out); else out[key] = v;
  }
  return out;
};

// ---------- theme ----------
const setTheme = (t) => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
try { setTheme(localStorage.getItem("theme")); } catch {}
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark";
  setTheme(t); try { localStorage.setItem("theme", t); } catch {}
  route();
};
const isDark = () => getComputedStyle(document.documentElement).colorScheme.includes("dark");

// ---------- status ----------
const STATUS = {
  ok: ["good", "✓", "ok"], failed: ["critical", "✕", "failed"],
  running: ["warning", "●", "running"], incomplete: ["serious", "!", "incomplete"],
};
const statusBadge = (s) => {
  const [c, icon] = STATUS[s] || ["serious", "?"];
  const label = STATUS[s] ? t("st_" + s) : s;
  return el("span", { class: "badge" }, el("span", { class: "dot", style: `background:var(--${c})` }), `${icon} ${label}`);
};

// ---------- tooltip ----------
const tip = $("#tooltip");
const showTip = (e, nodes) => {
  tip.replaceChildren(...nodes); tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
};
const hideTip = () => { tip.style.display = "none"; };

// ---------- sequential ramp (blue 100 -> 700) ----------
const RAMP = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5",
  "#2a78d6", "#256abf", "#1c5cab", "#184f95", "#104281", "#0d366b"];
const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rampColor = (t) => {
  const ramp = isDark() ? [...RAMP].reverse().slice(0, 11) : RAMP;  // dark: low recedes into the dark surface
  const x = Math.max(0, Math.min(1, t)) * (ramp.length - 1), i = Math.floor(x), f = x - i;
  const a = hex2rgb(ramp[i]), b = hex2rgb(ramp[Math.min(i + 1, ramp.length - 1)]);
  const c = a.map((v, k) => Math.round(v + (b[k] - v) * f));
  const lum = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
  return { bg: `rgb(${c.join(",")})`, fg: lum > 0.55 ? "#0b0b0b" : "#ffffff" };
};

// ---------- state ----------
const state = { runs: [], docs: [], selected: new Set() };
const saveSel = () => sset("cmp", [...state.selected]);
async function loadRuns() { state.runs = await api("/api/runs"); }

// ---------- router ----------
async function route() {
  hideTip();
  const [page, ...rest] = (location.hash.slice(2) || "runs").split("/").map(decodeURIComponent);
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("active", a.dataset.nav === (page === "run" ? "runs" : page)));
  try {
    if (page === "runs") await pageRuns(rest[0]);
    else if (page === "run") await pageRun(rest[0], rest[1] || "overview");
    else if (page === "compare") await pageCompare(rest[0]);
    else if (page === "docs") await pageDocs(rest[0]);
    else if (page === "data") await pageData(rest[0], rest[1], rest[2]);

    setMain(el("div", { class: "empty" }, `${t("error")}: ${e.message}`));
  }
}
addEventListener("hashchange", route);

// ---------- sidebar: experiments ----------
function sideExperiments(active) {

// ---------- Run page ----------
async function pageRun(id, tab) {

// Fruchterman–Reingold layout, deterministic (seeded) so the same ego network looks the same.
function forceLayout(n, edges, W, H) {
  let seed = 12345;
  const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  const P = Array.from({ length: n }, (_, i) => {
    const a = 2 * Math.PI * i / Math.max(n, 1), r = Math.min(W, H) * (0.15 + 0.25 * rnd());
    return [W / 2 + Math.cos(a) * r, H / 2 + Math.sin(a) * r];
  });
  if (n <= 1) return n ? [[W / 2, H / 2]] : P;
  const k = 0.75 * Math.sqrt((W * H) / n), iters = n > 500 ? 90 : n > 250 ? 160 : 260;
  let temp = W / 8;
  for (let it = 0; it < iters; it++) {
    const D = Array.from({ length: n }, () => [0, 0]);
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      let dx = P[i][0] - P[j][0], dy = P[i][1] - P[j][1];
      const d2 = Math.max(dx * dx + dy * dy, 0.01), f = (k * k) / d2;
      dx *= f; dy *= f; D[i][0] += dx; D[i][1] += dy; D[j][0] -= dx; D[j][1] -= dy;
    }
    for (const [a, b] of edges) {
      if (a === b) continue;
      const dx = P[a][0] - P[b][0], dy = P[a][1] - P[b][1], d = Math.max(Math.hypot(dx, dy), 0.01), f = d / k;
      D[a][0] -= dx * f; D[a][1] -= dy * f; D[b][0] += dx * f; D[b][1] += dy * f;
    }
    for (let i = 0; i < n; i++) {
      D[i][0] += (W / 2 - P[i][0]) * 0.05; D[i][1] += (H / 2 - P[i][1]) * 0.05;  // gravity
      const d = Math.max(Math.hypot(D[i][0], D[i][1]), 0.01), m = Math.min(d, temp);
      P[i][0] = Math.min(W - 12, Math.max(12, P[i][0] + D[i][0] / d * m));
      P[i][1] = Math.min(H - 12, Math.max(12, P[i][1] + D[i][1] / d * m));
    }
    temp *= 0.97;
  }
  return P;
}

        const counts = {}; vals.forEach((v) => { const k = String(v); counts[k] = (counts[k] || 0) + 1; });
        const cats = distinct.sort((a, b) => counts[b] - counts[a] || (a > b ? 1 : -1)).slice(0, 7);
        const slot = Object.fromEntries(cats.map((c, i) => [c, cvar(`--series-${i + 1}`)]));
        colorOf = (i) => slot[String(vals[i])] || cvar("--text-muted");
        legend = cats.map((c) => [slot[c], `${c} (${counts[c]})`]);
        if (distinct.length > cats.length) legend.push([cvar("--text-muted"), t("other")]);
      }
    }
    const wrap = el("div", { style: "position:relative" });
    const canvas = el("canvas", { style: "width:100%;height:560px;display:block;border-radius:8px;background:var(--surface-2);cursor:pointer" });
    wrap.append(canvas);
    viewBox.replaceChildren(
      el("div", { class: "sub", style: "margin:10px 0 8px" }, t("egoTitle", smp.center, nodes.length, smp.edges.length), smp.truncated ? ` · ${t("truncatedSample")}` : "", ` · ${t("clickHint")}`),
      wrap,
      legend.length ? el("div", { class: "legend" }, ...legend.map(([c, l]) => el("span", {}, el("i", { style: `background:${c};height:10px;width:10px;border-radius:50%` }), l))) : null);
    const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = 560;
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
    const P = forceLayout(nodes.length, smp.edges, W, H);
    const radius = nodes.map((nd) => Math.min(14, 3 + 1.6 * Math.log2(1 + nd.deg)));
    const byDeg = nodes.map((_, i) => i).sort((a, b) => nodes[b].deg - nodes[a].deg).slice(0, 8);
    const render = (hover) => {
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = cvar("--text-muted"); ctx.globalAlpha = smp.edges.length > 800 ? 0.18 : 0.35; ctx.lineWidth = 1;
      const arrows = smp.directed && smp.edges.length <= 600;
      for (const [a, b] of smp.edges) {
        ctx.beginPath(); ctx.moveTo(P[a][0], P[a][1]); ctx.lineTo(P[b][0], P[b][1]); ctx.stroke();
        if (arrows && a !== b) {
          const ang = Math.atan2(P[b][1] - P[a][1], P[b][0] - P[a][0]), x = P[b][0] - Math.cos(ang) * (radius[b] + 2), y = P[b][1] - Math.sin(ang) * (radius[b] + 2);
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 7 * Math.cos(ang - 0.4), y - 7 * Math.sin(ang - 0.4)); ctx.lineTo(x - 7 * Math.cos(ang + 0.4), y - 7 * Math.sin(ang + 0.4)); ctx.closePath();
          ctx.fillStyle = cvar("--text-muted"); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      nodes.forEach((nd, i) => {
        ctx.beginPath(); ctx.arc(P[i][0], P[i][1], radius[i], 0, 2 * Math.PI);
        ctx.fillStyle = colorOf(i); ctx.fill();
        ctx.lineWidth = i === 0 || i === hover ? 2.5 : 1.5;
        ctx.strokeStyle = i === 0 || i === hover ? cvar("--text-primary") : cvar("--surface-2"); ctx.stroke();
      });
      ctx.fillStyle = cvar("--text-primary"); ctx.font = "11px system-ui, sans-serif";
      new Set([0, ...byDeg, ...(hover != null ? [hover] : [])]).forEach((i) => {
        const w = ctx.measureText(nodes[i].id).width, right = P[i][0] + radius[i] + 3 + w <= W - 4;
        ctx.fillText(nodes[i].id, right ? P[i][0] + radius[i] + 3 : P[i][0] - radius[i] - 3 - w, Math.max(12, P[i][1] - radius[i] - 2));
      });
    };
    render();
    const nearest = (e) => {
      const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      let best = null, bd = Infinity;
      P.forEach(([px, py], i) => { const d = Math.hypot(px - x, py - y); if (d < radius[i] + 8 && d < bd) { bd = d; best = i; } });
      return best;
    };
    canvas.onpointermove = (e) => {
      const i = nearest(e);
      render(i);
      if (i == null) return hideTip();
      const nd = nodes[i];
      showTip(e, [el("div", { class: "v" }, nd.id),
        el("div", { class: "l" }, smp.directed ? `${t("degree")} ${nd.deg} (in ${nd.in}, out ${nd.out})` : `${t("degree")} ${nd.deg}`),
        el("div", { class: "l" }, `hop ${nd.hop}`),
        ...Object.entries(nd.attrs).slice(0, 10).map(([k, v]) => el("div", { class: "l" }, `${k}: ${fmt(v)}`))]);
    };
    canvas.onpointerleave = () => { render(); hideTip(); };
    canvas.onclick = (e) => { const i = nearest(e); if (i != null && i !== 0) { hideTip(); load(nodes[i].id); } };
  }

  load();
}

// ---------- Compare ----------
async function pageCompare(idList) {
  await loadRuns();
  sideExperiments(null);
  const wanted = idList ? idList.split(",") : [...state.selected];
  const ids = wanted.filter((id) => state.runs.some((r) => r.run_id === id));
  if (ids.length < 2) {
    return setMain(el("h1", {}, t("navCompare")),
      el("div", { class: "empty" }, t("selectTwo")));
  }
  const runs = await Promise.all(ids.map((id) => api(`/api/run/${encodeURIComponent(id)}`)));
  const flats = runs.map((r) => flatten({ config: r.config, summary: r.summary, tags: r.meta.tags }));
  const keys = [...new Set(flats.flatMap(Object.keys))].sort();
  const onlyDiff = el("input", { type: "checkbox", id: "od" }); onlyDiff.checked = true;
  const tbody = el("tbody");
  const render = () => tbody.replaceChildren(...keys.filter((k) => {
    const vals = flats.map((f) => JSON.stringify(f[k]));
    return !onlyDiff.checked || new Set(vals).size > 1;
  }).map((k) => {
    const changed = new Set(flats.map((f) => JSON.stringify(f[k]))).size > 1;
    return el("tr", {}, el("td", { class: "mono" }, k), ...flats.map((f) => el("td", { class: "mono" + (changed ? " changed" : "") }, fmt(f[k]))));
  }));
  onlyDiff.onchange = render; render();
  setMain(el("h1", {}, t("navCompare")),
    el("div", { class: "toolbar" }, onlyDiff, el("label", { for: "od" }, t("onlyDiff")),
      el("button", { onclick: () => { state.selected.clear(); saveSel();
        if (location.hash === "#/compare") pageCompare(); else location.hash = "#/compare"; } }, t("resetSel"))),
    el("div", { class: "card scroll diff" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, t("key")), ...runs.map((r) => el("th", {}, el("a", { href: `#/run/${r.run_id}`, class: "mono" }, r.run_id))))),
      tbody)));
}

// ---------- Docs ----------
async function pageDocs(name) {
  state.docs = await api("/api/docs");
  name = name || state.docs[0]?.name;
  setSide(el("h4", {}, t("navDocs")), ...state.docs.map((d) =>
    el("a", { href: `#/docs/${d.name}`, class: d.name === name ? "active" : "" }, el("span", {}, d.title))));
  if (!name) return setMain(el("div", { class: "empty" }, t("noDocs")));
  const d = await api(`/api/doc/${encodeURIComponent(name)}`);
  setMain(el("div", { class: "sub mono" }, d.path), el("div", { class: "card pad" }, md(d.text)));
}

// ---------- sync ----------
$("#sync").onclick = async () => {
  const b = $("#sync"); b.disabled = true; b.textContent = `⟳ ${t("syncing")}`;
  const r = await api("/api/sync", { method: "POST" }).catch((e) => ({ ok: false, output: e.message }));
  b.disabled = false; b.textContent = `⟳ ${CFG.sync_label}`;
  const toast = el("div", { class: "toast" }, statusBadge(r.ok ? "ok" : "failed"), " ",
    r.ok ? t("syncOk") : el("pre", { class: "raw", style: "max-height:200px;padding:6px 0" }, r.output));
  document.body.append(toast); setTimeout(() => toast.remove(), r.ok ? 3000 : 10000);
  route();
};

// ---------- init ----------
(async () => {
  try { CFG = { ...CFG, ...(await api("/api/config")) }; } catch {}
  document.documentElement.lang = CFG.lang;
  const urlTheme = new URLSearchParams(location.search).get("theme");  // ?theme=dark|light, not persisted
  if (urlTheme === "dark" || urlTheme === "light") setTheme(urlTheme);
  document.title = CFG.title;
  $("#brand").replaceChildren(CFG.title, " ", el("span", {}, "· runboard"));
  document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
  $("#nav-docs").hidden = !CFG.has_docs;
  if (CFG.sync_label) { $("#sync").hidden = false; $("#sync").textContent = `⟳ ${CFG.sync_label}`; }
  state.selected = new Set(sget("cmp", []));
  route();
})();
</script>
